name: Controlli

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlli:
    name: Qualità, prove e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prova
          POSTGRES_PASSWORD: prova
          POSTGRES_DB: prova
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prova"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://prova:prova@localhost:5432/prova
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regole del codice
        run: npm run lint
      - name: Formato del codice
        run: npm run formato
      - name: Controllo dei tipi
        run: npm run tipi
      - name: Prove automatiche (comprese le migrazioni su PostgreSQL)
        run: npm test
      - name: Prove delle frasi sulla demo
        run: npm run test:demo
      - name: Build
        run: npm run build

  piano:
    name: Piano di progetto coerente
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Il piano si legge senza errori
        run: python3 scripts/piano.py stato > /dev/null

  docker:
    name: Immagini Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile.server -t ordinachatbot-server .
      - run: docker build -f infra/Dockerfile.web -t ordinachatbot-web .
