# Ordinachatbot — elenco dei task del progetto
#
# Questo file è la fonte unica dello stato del progetto.
# Il Gantt (docs/GANTT.md) e il report di avanzamento (docs/STATO.md)
# vengono rigenerati da qui con:  python3 scripts/piano.py
#
# Campi di ogni task:
#   id          codice univoco (es. OC1-03)
#   titolo      cosa si fa
#   fase        0-7 (vedi elenco fasi sotto). Riordino dell'11/11/2026: il rilascio
#               (OC5-xx) è in fase 3; pagamenti (OC3-xx) in fase 4 e stampanti (OC4-xx)
#               in fase 5, tutti e due dopo la consegna.
#               Gli ID non cambiano.
#   giorni      stima in giorni lavorativi (anche mezze giornate: 0.5, 1.5)
#   impegno     giorni di lavoro effettivo, se minori di "giorni": il resto è attesa
#               di terzi (fornitori, consulente) e non occupa nessuno del team
#   dipende_da  task che devono essere "fatto" prima di iniziare questo
#   stato       da_fare | in_corso | fatto | bloccato
#   assegnato   chi lo sta facendo (vuoto se libero)
#   inizio      data reale di inizio (AAAA-MM-GG), compilata quando si avvia
#   fine        data reale di fine, compilata quando si chiude
#   esterno     true se richiede account, credenziali, acquisti o decisioni esterne
#   anticipa    true per avviarlo il prima possibile (tempi esterni lunghi)
#   non_prima_di data prima della quale non si può iniziare
#   note        dettagli utili

progetto:
  nome: Ordinachatbot
  inizio_previsto: 2026-11-10
  persone_in_parallelo: 2   # Enrico e Paolo, ognuno con le proprie sessioni di Claude
  scadenza_obiettivo: 2026-12-04   # richiesta di Paolo del 10/11: versione 1 in vendita ai primi di dicembre
  festivi:
    - 2026-12-08
    - 2026-12-24
    - 2026-12-25
    - 2026-12-26
    - 2026-12-31
    - 2027-01-01
    - 2027-01-06
    - 2027-03-29   # Lunedì dell'Angelo
    - 2027-06-02

fasi:
  0: Avvio e impostazione
  1: Locale, menu, aspetto e QR code (Demo 1)
  2: Chatbot, ordini e area comande su smartphone (Demo 2)
  3: Sito, domini, SaaS e prima consegna (versione 1, si paga in cassa)
  4: Pagamenti dal tavolo con Stripe, tutti insieme, dopo la consegna
  5: Stampanti termiche per le comande, dopo la consegna
  6: Cassa e gestionale, dopo la consegna (vendibile a parte)
  7: Altre funzioni dopo il rilascio

milestone:
  - id: M1
    titolo: "Demo 1 — menu, grafica e QR code dei tavoli"
    dopo: [OC1-15]
  - id: M2
    titolo: "Demo 2 — si ordina con il chatbot e le comande arrivano sugli smartphone"
    dopo: [OC2-12]
  - id: M5
    titolo: "Prima consegna (versione 1) — chatbot e area comande, si paga in cassa"
    dopo: [OC5-10]
  - id: M3
    titolo: "Pagamenti dal tavolo con Stripe"
    dopo: [OC3-08]
  - id: M4
    titolo: "Stampanti termiche — le comande escono anche dalla stampante"
    dopo: [OC4-05]
  - id: M6
    titolo: "Cassa e gestionale — modulo in vendita"
    dopo: [OC6-12]

tasks:
  # ---------------- FASE 0 — AVVIO ----------------
  - id: OC0-01
    titolo: Repository, piano di progetto, regole di lavoro, specifiche e manuale (bozza)
    fase: 0
    giorni: 1
    dipende_da: []
    stato: fatto
    assegnato: Claude
    inizio: 2026-11-10
    fine: 2026-11-10
    note: README, CLAUDE.md, docs/SPECIFICHE.md, docs/MANUALE.md, task e Gantt.

  - id: OC0-02
    titolo: Decisioni di architettura (stack, hosting, motore del chatbot)
    fase: 0
    giorni: 1
    dipende_da: [OC0-01]
    esterno: true
    note: >
      Da decidere insieme e scrivere in docs/decisioni/0001-architettura.md:
      (1) stesso stack di FarmacoFacile (React + TypeScript, PostgreSQL) sì/no;
      (2) hosting: nostro server VPS oppure servizio gestito;
      (3) motore del chatbot: modello linguistico a pagamento a consumo oppure
      open source sul nostro server (costi e velocità a confronto, serve risposta
      entro 2-3 secondi); (4) nome e dominio del prodotto. Vedi SPECIFICHE §13.
    stato: fatto
    fine: 2026-11-11
    inizio: 2026-11-11
    assegnato: Paolo

  - id: OC0-03
    titolo: Scelta del fornitore di pagamenti e conto di prova
    fase: 4
    giorni: 3
    impegno: 0.5
    dipende_da: [OC0-01, OC5-10]
    esterno: true
    note: >
      Serve un fornitore che faccia incassare direttamente il locale (conto
      intestato al locale, noi solo piattaforma tecnica) e copra Apple Pay,
      Google Pay, Satispay, Revolut Pay; verificare Bancomat Pay (oggi passa da
      altri circuiti, es. Nexi XPay). Confrontare commissioni e tempi di
      attivazione. Aprire un conto di prova. Vedi SPECIFICHE §7.
      Riordino dell'11/11/2026: conta nella fase 3 con tutti gli altri pagamenti.
      Deciso l'11/11/2026: Stripe (docs/decisioni/0002-pagamenti.md). Il conto
      Stripe si apre alla consegna del primo locale (decisione di Paolo): fino
      ad allora i pagamenti dal tavolo non si sviluppano, perché non si possono
      provare.
    stato: da_fare

  - id: OC0-04
    titolo: Struttura del progetto, controlli di qualità, test e CI su GitHub Actions
    fase: 0
    giorni: 1
    dipende_da: [OC0-02]

  - id: OC0-05
    titolo: Ambiente di sviluppo (database, accessi, archivio foto, variabili d'ambiente)
    fase: 0
    giorni: 1
    dipende_da: [OC0-02]
    esterno: true
    note: Solo dati finti. Le chiavi non vanno mai nel repository.

  - id: OC0-06
    titolo: Scelta dell'hardware di riferimento e acquisto di un kit di prova
    fase: 5
    giorni: 5
    impegno: 0.5
    dipende_da: [OC0-01, OC5-10]
    esterno: true
    note: >
      Riordino dell'11/11/2026: le stampanti si collegano dopo la prima consegna,
      quindi il kit si compra allora. Basta una stampante termica di rete 80 mm
      (meglio se "cloud", cioè che si collega da sola a internet). Stampante
      fiscale RT e monitor touch servono solo per la cassa (fase 6).
      Modelli in docs/hardware.md.
    stato: da_fare

  - id: OC0-07
    titolo: Verifica fiscale e privacy con un consulente
    fase: 3
    giorni: 5
    impegno: 0.5
    dipende_da: [OC0-01, OC2-12]
    esterno: true
    note: >
      Domande in docs/domande-consulente.md (da scrivere in questo task):
      scontrino per i pagamenti dal tavolo, collegamento POS-RT anche per i
      pagamenti online, reparti e aliquote IVA, chi è titolare dei dati dei
      clienti, obblighi sugli allergeni nel menu digitale, contratto SaaS.
    stato: da_fare
    # Decisione di Paolo dell'11/11/2026: il consulente si sente dopo la demo del chatbot.

  - id: OC0-08
    titolo: Demo cliccabile da mostrare ai locali (sito, menu, chatbot, vista gestore)
    fase: 0
    giorni: 0.5
    dipende_da: [OC0-01]
    stato: fatto
    assegnato: Claude
    inizio: 2026-11-10
    fine: 2026-11-10
    note: >
      demo/index.html, pubblicata anche come pagina. Locale inventato, risposte
      simulate con regole semplici, nessun ordine o pagamento reale (etichette
      DEMO/PROVA). Non è codice del prodotto: serve per le presentazioni.

  - id: OC0-09
    titolo: Regole di sicurezza su allergeni e celiachia — logica comune con prove automatiche
    fase: 0
    giorni: 1
    dipende_da: [OC0-04]
    note: >
      Libreria condivisa (packages/shared): i 14 allergeni, passaggio
      ingrediente → piatto, regola dell'etichetta «senza glutine», riconoscimento
      dei messaggi su allergeni/celiachia. Regole in docs/allergeni.md. Le prove
      girano a ogni modifica e bloccano l'unione se falliscono.

  # ---------------- FASE 1 — LOCALE, MENU, ASPETTO, QR ----------------
  - id: OC1-01
    titolo: Schema dei dati multi-locale e isolamento tra locali
    fase: 1
    giorni: 1.5
    dipende_da: [OC0-04, OC0-05]
    note: Ogni dato appartiene a un locale; isolamento nel database e lato server.

  - id: OC1-02
    titolo: Accesso e ruoli (super amministratore, titolare, cassa, sala, cucina)
    fase: 1
    giorni: 1
    dipende_da: [OC1-01]

  - id: OC1-03
    titolo: Area super amministratori — crea locale, lavora per conto del locale, sospendi
    fase: 1
    giorni: 1.5
    dipende_da: [OC1-02]
    note: >
      Noi possiamo configurare tutto al posto del gestore. Ogni operazione fatta
      "per conto di" resta registrata con il nostro nome.

  - id: OC1-04
    titolo: Componenti grafici di base e struttura del pannello
    fase: 1
    giorni: 1
    dipende_da: [OC0-04]
    note: >
      Comprende le funzioni comuni per date, ore e prezzi in formato italiano
      (martedì 10 novembre 2026, 10/11/2026, 22:30, € 8,50), ora italiana, da
      usare ovunque: pannello, chat, comande, scontrini, resoconti.

  - id: OC1-05
    titolo: Configurazione guidata del locale (dati, tipologie, orari, moduli attivi)
    fase: 1
    giorni: 1
    dipende_da: [OC1-02, OC1-04]
    note: >
      Tipologie a scelta multipla: bar, pub, ristorante, pizzeria. Moduli
      attivabili: stampanti, pagamenti dal tavolo, cassa/gestionale, sito.

  - id: OC1-06
    titolo: Menu — categorie libere con foto, ordine e orari di disponibilità
    fase: 1
    giorni: 1
    dipende_da: [OC1-05]
    note: Categorie proposte in base alla tipologia, tutte modificabili.

  - id: OC1-07
    titolo: Menu — prodotti con prezzo, descrizione, foto, ingredienti, varianti e aggiunte
    fase: 1
    giorni: 2
    dipende_da: [OC1-06]
    note: >
      Ingredienti come elenco riutilizzabile (servono al chatbot per "pizze con…"
      e "senza…"). Per cibi e drink il gestore indica: varianti con il loro
      prezzo (piccola/media/grande, impasto integrale, doppio, analcolico…),
      aggiunte con il loro prezzo (mozzarella extra +1,50), ingredienti che si
      possono togliere. Gruppi riutilizzabili: si creano una volta (es. "Aggiunte
      pizza") e si applicano a un'intera categoria o a singoli prodotti.
      Modifiche libere (SPECIFICHE §4): ogni ingrediente del menu si può
      aggiungere, togliere o chiedere "poco"/"tanto"; il gestore imposta per
      ingrediente prezzo o gratis, "non aggiungibile", "ingrediente base", e i
      piatti non modificabili; cottura per le categorie che sceglie.

  - id: OC1-08
    titolo: Scheda ingrediente guidata — allergeni, glutine, verifica dell'etichetta
    fase: 1
    giorni: 1.5
    dipende_da: [OC1-07, OC0-09]
    note: >
      Come in docs/allergeni.md: per ogni ingrediente tre scelte per allergene
      (contiene / può contenere tracce / non contiene), stato del glutine,
      suggerimenti da un elenco di ingredienti comuni, conferma «ho controllato
      l'etichetta» con nome e data. Finché non è verificato l'ingrediente vale
      come «non dichiarato». Il piatto eredita tutto dagli ingredienti e dalle
      aggiunte. Altre etichette: vegetariano, vegano, piccante, surgelato.

  - id: OC1-09
    titolo: Inserimento veloce — griglia modificabile, duplica, importa da Excel, prezzi in blocco, esaurito
    fase: 1
    giorni: 1.5
    dipende_da: [OC1-07]

  - id: OC1-10
    titolo: Caricamento e alleggerimento automatico delle foto
    fase: 1
    giorni: 0.5
    dipende_da: [OC1-06]

  - id: OC1-11
    titolo: Aspetto — logo, 10 combinazioni di colori, 10 temi, anteprima dal vivo
    fase: 1
    giorni: 2
    dipende_da: [OC1-04, OC1-05]
    note: Colori e temi si combinano liberamente (100 aspetti). Controllo del contrasto.

  - id: OC1-12
    titolo: Sale e tavoli — creazione, numerazione, posti
    fase: 1
    giorni: 1
    dipende_da: [OC1-05]

  - id: OC1-13
    titolo: QR code dei tavoli — generazione, fogli da stampare in PDF, rigenerazione
    fase: 1
    giorni: 1
    dipende_da: [OC1-12]
    note: >
      Il QR contiene un codice del tavolo non indovinabile, non il numero in chiaro.
      L'indirizzo nel QR resta valido anche se il locale cambia dominio (OC5-03).

  - id: OC1-14
    titolo: Menu pubblico consultabile senza chatbot, con la grafica del locale
    fase: 1
    giorni: 1.5
    dipende_da: [OC1-08, OC1-11]

  - id: OC1-15
    titolo: Locali dimostrativi (uno per tipologia) e Demo 1
    fase: 1
    giorni: 0.5
    dipende_da: [OC1-03, OC1-09, OC1-10, OC1-13, OC1-14]

  # ---------------- FASE 2 — CHATBOT E ORDINI ----------------
  - id: OC2-01
    titolo: Sessione del tavolo — apertura dal QR, partecipanti con nome, tempo reale
    fase: 2
    giorni: 1.5
    dipende_da: [OC1-13]

  - id: OC2-02
    titolo: Schermata della chat — messaggi, schede prodotto con foto, pulsanti di scelta
    fase: 2
    giorni: 2
    dipende_da: [OC1-14, OC2-01]

  - id: OC2-03
    titolo: Motore del chatbot — capisce la richiesta e cerca nel menu
    fase: 2
    giorni: 2.5
    dipende_da: [OC0-02, OC1-08]
    note: >
      Richieste per categoria, ingrediente presente o assente, prezzo, menu intero.
      Il chatbot mostra solo prodotti e prezzi presi dal menu del locale: non
      inventa nulla. Prezzi e totali li calcola sempre il server.
      Sinonimi e famiglie di ingredienti (sugo = pomodoro, "senza formaggio"),
      modifiche scritte ("poco pomodoro", "ben cotta", "doppia mozzarella"),
      prima i piatti già così e poi quelli modificabili, e mai ignorare una
      condizione non capita: SPECIFICHE §5 "Sinonimi, famiglie e richieste non
      capite". Le 512 frasi di demo/prove-domande.mjs sono la prova minima.
      Ogni cibo nominato è cercato tra gli ingredienti, anche se non è nel
      menu: se manca lo dice, propone il più vicino e lo segnala al gestore
      (SPECIFICHE §5 "Ricerca per ingrediente"). Mai "non ho capito" su un cibo.
      Per ogni prodotto dice tutte le varianti e le aggiunte possibili con i
      prezzi, e risponde a domande come "quanto costa con doppia mozzarella?".
      Parla in italiano; giorni, date, ore e prezzi sempre in formato italiano.

  - id: OC2-04
    titolo: Blocco allergeni e celiachia configurabile e pulsante «Chiama il cameriere»
    fase: 2
    giorni: 1
    dipende_da: [OC2-03, OC0-09]
    note: >
      Il titolare sceglie: allergeni, celiachia, tutti e due o nessuno. Sugli
      argomenti bloccati il chatbot risponde subito con il messaggio fisso e
      avvisa il personale. Il blocco è una regola fissa, non lasciata al modello.

  - id: OC2-05
    titolo: Carrello condiviso del tavolo — voci per persona, varianti, note per la cucina
    fase: 2
    giorni: 1.5
    dipende_da: [OC2-01, OC2-02]

  - id: OC2-06
    titolo: Conferma unica per tutto il tavolo e ordini successivi
    fase: 2
    giorni: 1
    dipende_da: [OC2-05]
    note: >
      Uno solo conferma; gli altri vedono il riepilogo e chi ha confermato.
      Doppia conferma impossibile. Dopo l'invio si riapre un carrello vuoto.

  - id: OC2-07
    titolo: Stati dell'ordine e storico
    fase: 2
    giorni: 1
    dipende_da: [OC2-06]
    note: Passaggi consentiti in SPECIFICHE §5; controllati dal server.

  - id: OC2-08
    titolo: Scelta del pagamento in cassa e regole del locale (subito o a fine pasto)
    fase: 2
    giorni: 0.5
    dipende_da: [OC2-07]

  - id: OC2-09
    titolo: Protezioni — ordini da fuori locale, limiti, tavolo chiuso
    fase: 2
    giorni: 1
    dipende_da: [OC2-06]
    note: >
      Opzioni: il personale accetta il primo ordine del tavolo; codice breve
      esposto al tavolo; limite di importo senza pagamento anticipato.

  - id: OC2-10
    titolo: Lingue — italiano e inglese per menu e chatbot
    fase: 2
    giorni: 1
    dipende_da: [OC2-03]

  - id: OC2-11
    titolo: Area comande su smartphone per gestore e camerieri — tempo reale, avviso sonoro, avanzamento
    fase: 2
    giorni: 2
    dipende_da: [OC2-07]
    note: >
      È il modo principale di ricevere le comande nella prima consegna
      (richiesta di Paolo dell'11/11/2026). Gestore e camerieri entrano dal
      proprio smartphone (anche tablet o monitor), vedono le comande per tavolo
      appena confermate, con suono, e le fanno avanzare. Deve restare utile
      anche quando arriveranno le stampanti: il locale usa l'una, le altre o
      tutte e due.

  - id: OC2-12
    titolo: Prove complete del chatbot e Demo 2
    fase: 2
    giorni: 1
    dipende_da: [OC2-04, OC2-08, OC2-09, OC2-10, OC2-11, OC2-14, OC2-15]
    note: >
      Prova di accettazione: tutte le frasi di demo/prove-domande.mjs (512 al
      10/11, vedi docs/test/domande-tipiche.md) devono dare la risposta attesa
      anche col chatbot vero, più quelle di docs/test/frasi-difficili.md (frasi
      lunghe, ripensamenti, dialetto, altre lingue, provocazioni, allergeni indiretti).

  - id: OC2-13
    titolo: Domande senza risposta — il chatbot le mette da parte per il gestore
    fase: 2
    giorni: 1
    dipende_da: [OC2-03]
    note: >
      Quando il chatbot non sa rispondere lo dice, propone il cameriere e salva
      la domanda (con le battute intorno, data e tavolo, senza dati personali)
      nell'elenco "Domande da rivedere". Domande uguali vengono raggruppate.

  - id: OC2-14
    titolo: Il gestore risponde con calma e il chatbot impara
    fase: 2
    giorni: 1.5
    dipende_da: [OC2-13, OC2-04]
    note: >
      Dal pannello il gestore scrive la risposta giusta, oppure segna "da
      ignorare". Le risposte diventano "domande e risposte del locale" che il
      chatbot usa da subito; si possono correggere e cancellare. Le risposte
      del gestore non scavalcano il blocco allergeni/celiachia e non cambiano
      prezzi o menu. Lo possono fare anche i super amministratori.

  - id: OC2-15
    titolo: Prove severe su allergeni e celiachia (obbligatorie prima di ogni rilascio)
    fase: 2
    giorni: 1.5
    dipende_da: [OC2-04, OC2-14, OC1-08]
    note: >
      Elenco in docs/allergeni.md §6: almeno 300 frasi (italiano, errori di
      battitura, dialetto, inglese, giri di parole, tentativi di aggirare il
      blocco) che devono essere bloccate tutte; frasi innocenti che non devono
      esserlo; piatto mai «senza glutine» se manca una verifica; risposte del
      gestore che non scavalcano il blocco; nota di allergia evidenziata sulla
      comanda. Un solo errore blocca il rilascio.

  # ---------------- FASE 4 — PAGAMENTI DAL TAVOLO (DOPO LA CONSEGNA; gli ID restano OC3-xx) ----------------
  - id: OC3-01
    titolo: Collegamento del conto di incasso del locale
    fase: 4
    giorni: 1.5
    dipende_da: [OC0-03, OC1-05]
    esterno: true

  - id: OC3-02
    titolo: Pagamento dal tavolo con Apple Pay, Google Pay e carta
    fase: 4
    giorni: 1.5
    dipende_da: [OC3-01, OC2-08]

  - id: OC3-03
    titolo: Pagamento con Satispay, Revolut Pay e PayPal
    fase: 4
    giorni: 1
    dipende_da: [OC3-02]

  - id: OC3-04
    titolo: Pagamento con Bancomat Pay
    fase: 4
    giorni: 1.5
    dipende_da: [OC3-02]
    esterno: true
    note: Dipende dall'esito di OC0-03; può richiedere un secondo fornitore.

  - id: OC3-05
    titolo: Conferma dell'incasso, invio in cucina dopo il pagamento, errori e rimborsi
    fase: 4
    giorni: 1.5
    dipende_da: [OC3-02]
    note: L'ordine parte solo con la conferma del fornitore, mai dalla pagina del cliente.

  - id: OC3-06
    titolo: Conto del tavolo — paga tutto, paga la tua parte, dividi in parti uguali, mancia
    fase: 4
    giorni: 1.5
    dipende_da: [OC3-05]

  - id: OC3-07
    titolo: Ricevuta al cliente e riepilogo incassi per il titolare
    fase: 4
    giorni: 1
    dipende_da: [OC3-05]

  - id: OC3-08
    titolo: Prove in ambiente di test dei pagamenti e demo dei pagamenti
    fase: 4
    giorni: 0.5
    dipende_da: [OC3-03, OC3-04, OC3-06, OC3-07]

  # ---------------- FASE 5 — STAMPANTI TERMICHE (DOPO LA CONSEGNA; gli ID restano OC4-xx) ----------------
  - id: OC4-01
    titolo: Servizio di stampa — coda, formato della comanda, ristampa
    fase: 5
    giorni: 1.5
    dipende_da: [OC2-07]

  - id: OC4-02
    titolo: Collegamento delle stampanti termiche del locale
    fase: 5
    giorni: 2
    dipende_da: [OC4-01, OC0-06]
    note: >
      Il nostro server non raggiunge da solo le stampanti dentro il locale:
      o stampanti che si collegano loro a internet, o un piccolo programma
      "ponte" su un dispositivo del locale. Scelta in docs/hardware.md.

  - id: OC4-03
    titolo: Zone di stampa (cucina, pizzeria, bar, cassa) e categorie associate
    fase: 5
    giorni: 1
    dipende_da: [OC4-01]

  - id: OC4-04
    titolo: Controllo delle stampanti — carta finita, spenta, stampa di riserva, avvisi
    fase: 5
    giorni: 1
    dipende_da: [OC4-02, OC4-03]

  - id: OC4-05
    titolo: Collaudo sul kit reale e demo delle stampanti
    fase: 5
    giorni: 0.5
